name: ZhiShu-Agent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-industry-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify all 7 industry projects (Structure + PMP + Pytest)
        run: python scripts/verify_all_projects.py

      - name: Verify Stage 6 Capstone & Graduation tests
        run: |
          pytest project_iterations/day_63/tests -v
          pytest project_iterations/day_64/tests -v
          pytest project_iterations/day_70/tests -v
