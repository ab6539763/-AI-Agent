services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p07-devsecops-backend
    ports:
      - "${P07_BACKEND_PORT:-8000}:8000"
    environment:
      - P07_HOST=0.0.0.0
      - P07_PORT=8000
      - P07_WIKI_DIR=/data/wiki
    volumes:
      - p07_wiki_data:/data/wiki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: p07-devsecops-frontend
    ports:
      - "${P07_FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  p07_wiki_data:
