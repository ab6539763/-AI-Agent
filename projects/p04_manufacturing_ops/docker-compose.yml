services:
  manufacturing-ops:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p04-manufacturing-ops
    ports:
      - "${APP_PORT:-8004}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      WIKI_DIR: /app/data/wiki
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - wiki_data:/app/data/wiki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  wiki_data:
