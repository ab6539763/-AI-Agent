services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p04-manufacturing-ops-backend
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      WIKI_DIR: /app/data/wiki
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - wiki_data:/app/data/wiki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: p04-manufacturing-ops-frontend
    ports:
      - "${P04_FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  wiki_data:
