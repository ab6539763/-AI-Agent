services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p03-legal-contract-backend
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env.example
    environment:
      - WIKI_DIR=/app/data/legal_wiki
      - OFFLINE_MODE=true
    volumes:
      - legal_wiki_data:/app/data/legal_wiki
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: p03-legal-contract-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  legal_wiki_data:
