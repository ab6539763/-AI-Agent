services:
  legal-contract-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p03-legal-contract-agent
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env.example
    environment:
      - WIKI_DIR=/app/data/legal_wiki
      - OFFLINE_MODE=true
    volumes:
      - legal_wiki_data:/app/data/legal_wiki
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  legal_wiki_data:
