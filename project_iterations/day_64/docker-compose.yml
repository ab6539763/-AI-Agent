services:
  zhishu-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: zhishu-agent:v1.0.0-day64
    container_name: zhishu-agent-prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      SERVICE_NAME: zhishu-agent
      WORKERS: "4"
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
