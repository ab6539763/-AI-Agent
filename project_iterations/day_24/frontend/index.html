<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智枢企业级智能体平台 · Web ChatGPT (v0.2.0-day24)</title>
  <style>
    :root {
      --bg-sidebar: #0f172a;
      --bg-main: #111827;
      --bg-card: #1e293b;
      --bg-user: #2563eb;
      --bg-assistant: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-main);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }
    .sidebar {
      width: 280px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    .brand {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }
    .btn:hover { background: #334155; }
    .btn-primary {
      background: #0284c7;
      border-color: #0284c7;
      font-weight: 600;
    }
    .btn-primary:hover { background: #0369a1; }
    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 12px;
      padding: 6px 10px;
    }
    .session-list {
      flex: 1;
      overflow-y: auto;
      margin: 14px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .session-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-item:hover { background: rgba(51, 65, 85, 0.5); }
    .session-item.active {
      background: var(--bg-card);
      border-color: var(--accent);
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .topbar {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.7);
    }
    .topbar-title { font-size: 15px; font-weight: 600; }
    .topbar-meta { font-size: 12px; color: var(--muted); }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
    }
    .msg-row.user { align-items: flex-end; }
    .msg-row.assistant { align-items: flex-start; }
    .msg-role {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      padding: 0 4px;
    }
    .msg-bubble {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.65;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 85%;
    }
    .msg-row.user .msg-bubble {
      background: var(--bg-user);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .msg-row.assistant .msg-bubble {
      background: var(--bg-assistant);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .composer {
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      background: var(--bg-sidebar);
    }
    .composer-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      resize: none;
      height: 48px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: var(--text);
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    .empty-state {
      text-align: center;
      color: var(--muted);
      margin: auto;
      max-width: 460px;
    }
    .empty-state h2 { color: var(--text); margin-bottom: 8px; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span>智枢 ZhiShu AI</span>
      <span class="badge">v0.2.0-day24</span>
    </div>
    <button class="btn btn-primary" id="newChatBtn">+ 新建对话</button>
    <div class="session-list" id="sessionList"></div>
    <div style="font-size: 12px; color: var(--muted);">
      SQLite 本地持久化 · SSE 流式打字机
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="topbar-title" id="currentSessionTitle">默认会话</div>
        <div class="topbar-meta" id="currentSessionId">Session: default-session</div>
      </div>
      <button class="btn btn-danger" id="clearSessionBtn">清空当前会话</button>
    </header>

    <section class="messages" id="messagesContainer">
      <div class="empty-state" id="emptyState">
        <h2>欢迎使用智枢企业级智能体</h2>
        <p>第二阶段收官之作：基于 FastAPI <code>StreamingResponse</code> (SSE) + SQLite 持久化 + CORS 跨域支持。</p>
      </div>
    </section>

    <footer class="composer">
      <form class="composer-inner" id="chatForm">
        <textarea id="messageInput" placeholder="输入问题（例如：解释 SSE 流式输出与 SQLite 持久化），按 Enter 发送..."></textarea>
        <button class="btn btn-primary" type="submit" id="sendBtn">发送</button>
      </form>
    </footer>
  </main>

  <script>
    const API_BASE = "";
    let currentSessionId = localStorage.getItem("zhishu_session_id") || "session-demo-01";
    let isStreaming = false;

    const messagesContainer = document.getElementById("messagesContainer");
    const sessionListEl = document.getElementById("sessionList");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const currentSessionIdEl = document.getElementById("currentSessionId");
    const currentSessionTitleEl = document.getElementById("currentSessionTitle");

    function updateSessionHeader() {
      currentSessionIdEl.textContent = `Session: ${currentSessionId}`;
      localStorage.setItem("zhishu_session_id", currentSessionId);
    }

    function appendMessage(role, content) {
      const empty = document.getElementById("emptyState");
      if (empty) empty.remove();

      const row = document.createElement("div");
      row.className = `msg-row ${role}`;

      const roleEl = document.createElement("div");
      roleEl.className = "msg-role";
      roleEl.textContent = role === "user" ? "用户" : "智枢助手";

      const bubble = document.createElement("div");
      bubble.className = "msg-bubble";
      bubble.textContent = content;

      row.appendChild(roleEl);
      row.appendChild(bubble);
      messagesContainer.appendChild(row);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return bubble;
    }

    async function loadSessions() {
      const res = await fetch(`${API_BASE}/api/v1/sessions`);
      const data = await res.json();
      sessionListEl.innerHTML = "";
      for (const s of data.sessions || []) {
        const btn = document.createElement("button");
        btn.className = `session-item ${s.session_id === currentSessionId ? "active" : ""}`;
        btn.textContent = `${s.title || s.session_id} (${s.message_count})`;
        btn.onclick = async () => {
          currentSessionId = s.session_id;
          currentSessionTitleEl.textContent = s.title || s.session_id;
          updateSessionHeader();
          await loadHistory(currentSessionId);
          await loadSessions();
        };
        sessionListEl.appendChild(btn);
      }
    }

    async function loadHistory(sessionId) {
      const res = await fetch(`${API_BASE}/api/v1/sessions/${encodeURIComponent(sessionId)}/history`);
      const data = await res.json();
      messagesContainer.innerHTML = "";
      if (!data.messages || data.messages.length === 0) {
        messagesContainer.innerHTML = `
          <div class="empty-state" id="emptyState">
            <h2>开启新对话</h2>
            <p>当前会话暂无历史记录，发送消息后将自动写入 SQLite 数据库。</p>
          </div>`;
        return;
      }
      for (const msg of data.messages) {
        appendMessage(msg.role, msg.content);
      }
    }

    async function sendMessage(text) {
      if (!text.trim() || isStreaming) return;
      isStreaming = true;
      sendBtn.disabled = true;

      appendMessage("user", text);
      const assistantBubble = appendMessage("assistant", "");

      try {
        const response = await fetch(`${API_BASE}/api/v1/chat/stream`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: currentSessionId,
            message: text,
            delay_ms: 15,
          }),
        });

        if (!response.ok || !response.body) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const events = buffer.split("\n\n");
          buffer = events.pop() || "";

          for (const rawEvent of events) {
            const line = rawEvent.split("\n").find((l) => l.startsWith("data: "));
            if (!line) continue;
            const payload = JSON.parse(line.slice(6));
            if (payload.type === "delta") {
              assistantBubble.textContent += payload.content;
              messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
          }
        }
        await loadSessions();
      } catch (err) {
        assistantBubble.textContent = `请求失败: ${err.message}`;
      } finally {
        isStreaming = false;
        sendBtn.disabled = false;
      }
    }

    document.getElementById("chatForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = messageInput.value;
      messageInput.value = "";
      await sendMessage(text);
    });

    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        document.getElementById("chatForm").requestSubmit();
      }
    });

    document.getElementById("newChatBtn").addEventListener("click", async () => {
      currentSessionId = `session-${Date.now()}`;
      currentSessionTitleEl.textContent = "新对话";
      updateSessionHeader();
      await loadHistory(currentSessionId);
      await loadSessions();
    });

    document.getElementById("clearSessionBtn").addEventListener("click", async () => {
      await fetch(`${API_BASE}/api/v1/sessions/${encodeURIComponent(currentSessionId)}`, {
        method: "DELETE",
      });
      await loadHistory(currentSessionId);
      await loadSessions();
    });

    (async () => {
      updateSessionHeader();
      await loadHistory(currentSessionId);
      await loadSessions();
    })();
  </script>
</body>
</html>
