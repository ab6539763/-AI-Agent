# ==============================================================================
# 智枢企业级智能体平台 (ZhiShu-Agent) · Day 56 全栈容器编排配置
# 版本: v0.5.0-day56
# 服务拓扑: zhishu-api (FastAPI) + qdrant (向量库) + redis (缓存/队列)
# ==============================================================================

services:
  zhishu-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhishu-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://vllm:8001/v1}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SQLITE_DB_PATH: ${SQLITE_DB_PATH:-/app/data/zhishu.db}
    volumes:
      - zhishu_data:/app/data
      - zhishu_logs:/app/logs
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - zhishu-net

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: zhishu-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zhishu-net

  redis:
    image: redis:7.2-alpine
    container_name: zhishu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - zhishu-net

volumes:
  zhishu_data:
    driver: local
  zhishu_logs:
    driver: local
  qdrant_storage:
    driver: local
  redis_data:
    driver: local

networks:
  zhishu-net:
    driver: bridge
